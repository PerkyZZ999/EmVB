name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run fmt:check
      - run: bun run fallow
      # W-1014: advisory, against saved baselines; a new clone or complexity finding shows in the
      # log without failing the run. Refresh the baselines with `bun run fallow:baselines`.
      - run: bun run fallow:dupes
        continue-on-error: true
      - run: bun run fallow:health
        continue-on-error: true
      - run: bun run check:runtime
      - run: bun run check:seeds
      - run: bun run test
      - run: bun run test:astro

  emdash-1-4:
    # W-1008: development runs on EmDash 1.5 + Astro 7.4; EmVB still installs on stock EmDash 1.4
    # (the floor). The same unit and Astro tests run here on EmDash 1.4.0 (Kumo 2.6.0, forms
    # 0.2.12, zod 4.5.4), still on Astro 7.4. The repository-level script tests don't depend on
    # EmDash and run in the main job. Every release is also installed on a stock EmDash 1.4.0
    # and 1.5.0 site.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun scripts/use-emdash.ts 1.4.0
      - run: bun install
      - run: bun test ./packages ./test
      - run: bun run test:astro
      # D-070: EmDash 1.4 pins zod 4.5.4 (GHSA-mrhx-c7xc-m3w5, zod <4.6.6). Every bounded array
      # EmVB parses checks its length before its items, and issues are capped (W-989, S-03).
      - run: bun audit --audit-level=high --ignore=GHSA-mrhx-c7xc-m3w5

  audit:
    # Separate from the offline checks: needs the advisory database (W-890). The 1.5 base brings
    # zod 4.6.7, which has no open advisory: nothing is ignored (W-1007, W-1008).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high

  e2e-smoke:
    # W-1063: a Node-demo smoke set on every PR and main push (the whole suite takes ~17 min per
    # platform, so it runs on release tags below). The runner image's Google Chrome stands in for
    # the system Chromium (A-09: no browser download). Playwright and the dev servers need Node.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"
      EMVB_CHROMIUM: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run e2e:smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-smoke-results
          path: test-results/
          retention-days: 7

  e2e-full:
    # W-1063: the whole suite on both demos (node and Cloudflare, `e2e:full`) for release tags or
    # by hand, on the EmDash 1.4 floor and on the development base (the latest EmDash).
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        emdash: ["1.4.0", latest]
    env:
      CI: "1"
      EMVB_CHROMIUM: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - if: ${{ matrix.emdash != 'latest' }}
        run: bun scripts/use-emdash.ts ${{ matrix.emdash }}
      - run: bun install
      - run: bun run e2e:full
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-full-${{ matrix.emdash }}
          path: |
            test-results/
            e2e/.results/
          retention-days: 7
