name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run fmt:check
      - run: bun run fallow
      - run: bun run check:runtime
      - run: bun run check:seeds
      - run: bun run test
      - run: bun run test:astro

  audit:
    # Separate from the offline checks: needs the advisory database (W-890).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      # D-070 (2026-11-08): GHSA-mrhx-c7xc-m3w5 (zod <4.6.6) is ignored while EmDash 1.4 pins
      # zod 4.5.4 (D-058). EmVB's request arrays check their length before their items
      # (core/bounded-array.ts); layouts and designs are size-checked before zod. Revisit when
      # EmDash moves zod.
      - run: bun audit --audit-level=high --ignore=GHSA-mrhx-c7xc-m3w5
