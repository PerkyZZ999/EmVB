name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run fmt:check
      - run: bun run fallow
      # W-1014: advisory, against saved baselines; a new clone or complexity finding shows in the
      # log without failing the run. Refresh the baselines with `bun run fallow:baselines`.
      - run: bun run fallow:dupes
        continue-on-error: true
      - run: bun run fallow:health
        continue-on-error: true
      - run: bun run check:runtime
      - run: bun run check:seeds
      - run: bun run test
      - run: bun run test:astro

  emdash-1-4:
    # W-1008: development runs on EmDash 1.5 + Astro 7.4; EmVB still installs on stock EmDash 1.4
    # (the floor). The same unit and Astro tests run here on EmDash 1.4.0 (Kumo 2.6.0, forms
    # 0.2.12, zod 4.5.4), still on Astro 7.4. The repository-level script tests don't depend on
    # EmDash and run in the main job. Releases also install the packed plugin on a stock 1.4.0
    # and 1.5.0 site (the release gate in docs/project/PLAN_1.2.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun scripts/use-emdash.ts 1.4.0
      - run: bun install
      - run: bun test ./packages ./test
      - run: bun run test:astro
      # D-070: EmDash 1.4 pins zod 4.5.4 (GHSA-mrhx-c7xc-m3w5, zod <4.6.6). Every bounded array
      # EmVB parses checks its length before its items, and issues are capped (W-989, S-03).
      - run: bun audit --audit-level=high --ignore=GHSA-mrhx-c7xc-m3w5

  audit:
    # Separate from the offline checks: needs the advisory database (W-890). The 1.5 base brings
    # zod 4.6.7, which has no open advisory: nothing is ignored (W-1007, W-1008).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high
